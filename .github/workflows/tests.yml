# Unit tests, including the comparison with the 46 TRIM.exe and 24
# SRModule.exe reference cases (about 3 minutes).  On CPUs or platforms
# where lunasrim.vbmath cannot use the native x87 routines (non-Intel CPUs,
# macOS arm64) the pure Python math is used and tests/test_trim.py expects
# its one known difference (one LATERAL.txt line of HPbLong).
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.10', '3.12', '3.13']
        include:
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[web]" httpx
      - name: Native x87 math in use
        run: python -c "import lunasrim.vbmath as v; print('vbmath.NATIVE =', v.NATIVE)"
      - name: Tests
        run: python -m unittest discover tests -v
      - name: Command line
        run: |
          lunasrim --version
          lunasrim stopping H Si --emin 100keV --emax 1MeV
          lunasrim eloss H Si --energy 400keV --thickness 1um
